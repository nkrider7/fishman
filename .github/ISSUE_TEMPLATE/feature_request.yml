name: Feature request
description: Propose a new feature or enhancement
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For large or architectural ideas, consider opening a [Discussion](https://github.com/nkrider7/fishman/discussions) first.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
      placeholder: I want to import OpenAPI specs so I do not recreate requests by hand.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should Fishman behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you tried.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - REST
        - GraphQL
        - WebSocket
        - Git-native
        - Scanner
        - Import / Export
        - UI / UX
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: willingness
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement this
          required: false
