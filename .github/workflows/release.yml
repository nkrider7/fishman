# Production installers for Linux + Windows.
# Trigger: push tag v* (e.g. v0.1.0) → GitHub Release
# Manual: workflow_dispatch → build artifacts only (no Release)

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$TAG package.json=$PKG tauri.conf.json=$CONF Cargo.toml=$CARGO"
          if [[ "$TAG" != "$PKG" || "$TAG" != "$CONF" || "$TAG" != "$CARGO" ]]; then
            echo "::error::Version mismatch. Tag v$TAG must equal package.json, tauri.conf.json, and Cargo.toml ($PKG / $CONF / $CARGO)."
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            platform: ubuntu-22.04
            args: --bundles deb,appimage
            artifact: linux
          - name: windows
            platform: windows-latest
            args: --bundles nsis,msi
            artifact: windows
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: fishman-${{ matrix.artifact }}

      - name: Install JS dependencies
        run: npm ci

      # Tag push → build + upload assets to the GitHub Release for that tag
      - name: Build and publish (tagged release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Fishman v__VERSION__"
          releaseBody: |
            ## Fishman __VERSION__

            ### Downloads
            | Platform | File | Notes |
            |----------|------|--------|
            | Linux | `.AppImage` | Portable — `chmod +x` then run |
            | Linux | `.deb` | Ubuntu / Debian install |
            | Windows | NSIS `*-setup.exe` | Recommended installer for most users |
            | Windows | `.msi` | Enterprise / silent install (`msiexec`) |

            See `SHA256SUMS.txt` on this release for checksums.

            > **Windows note:** Builds are unsigned until Authenticode signing is configured.
            > SmartScreen may warn on first run — that is expected for new publishers.
            > Signing guide: https://v2.tauri.app/distribute/sign/windows/

            ### Verify
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # Manual run → build only (no GitHub Release)
      - name: Build (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fishman-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14

  checksums:
    name: Attach SHA256SUMS
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fishman-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          set -euo pipefail
          find . -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
