[package]
name = "fishman"
version = "0.1.1"
description = "Open-source, native, Git-first API client built with Tauri, Rust, and React"
authors = ["Narendra Nishad"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nkrider7/fishman"
homepage = "https://github.com/nkrider7/fishman"
documentation = "https://github.com/nkrider7/fishman"
keywords = [
  "api-client",
  "rest",
  "graphql",
  "websocket",
  "git",
  "tauri"
]
categories = ["development-tools", "gui"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fishman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", features = ["json", "multipart", "cookies"] }
tokio = { version = "1.52.3", features = ["full"] }
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
urlencoding = "2.1.3"
base64 = "0.22.1"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
tauri-plugin-dialog = "2.7.1"
mime_guess = "2.0.5"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
portable-pty = "0.8"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = "0.3"

