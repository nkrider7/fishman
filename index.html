<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fishman</title>
    <!-- Preload tiny splash mark so first paint never waits on a 243KB PNG -->
    <link rel="preload" as="image" href="/splash-fishman.webp" type="image/webp" />
    <link rel="preload" as="image" href="/splash-sun.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0a;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #a3a3a3;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        opacity: 1;
        transition: opacity 200ms ease, visibility 200ms ease;
      }

      #app-splash.app-splash-exit {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #app-splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(28, 119, 204, 0.12) 0%,
          transparent 44%
        );
        pointer-events: none;
      }

      #app-splash .mark {
        position: relative;
        width: 96px;
        height: 96px;
        z-index: 1;
      }

      #app-splash .sun {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        animation: splash-sun 8s linear infinite;
        will-change: transform;
      }

      #app-splash .fishman-wrap {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 78%;
        height: 78%;
        display: block;
        animation: splash-breathe 2.8s ease-in-out infinite;
        will-change: transform;
      }

      #app-splash .fishman {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      #app-splash h1 {
        position: relative;
        z-index: 1;
        margin: 1.15rem 0 0.3rem;
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #f5f5f5;
      }

      #app-splash p {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: 0.8125rem;
        color: #737373;
      }

      #app-splash .track {
        position: relative;
        z-index: 1;
        margin-top: 1.35rem;
        width: 6.5rem;
        height: 2px;
        overflow: hidden;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.1);
      }

      #app-splash .bar {
        width: 45%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(
          90deg,
          rgba(204, 28, 57, 0.35),
          #e85a4f,
          rgba(204, 28, 57, 0.35)
        );
        animation: splash-bar 1.05s ease-in-out infinite;
        will-change: transform;
      }

      @keyframes splash-sun {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes splash-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.025);
        }
      }

      @keyframes splash-bar {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(240%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash .sun,
        #app-splash .fishman-wrap,
        #app-splash .bar {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- Outside #root so React mount never clears the splash (avoids blank frame). -->
    <div id="app-splash" role="status" aria-busy="true" aria-live="polite">
      <div class="mark" role="img" aria-label="Fishman">
        <img
          class="sun"
          src="/splash-sun.svg"
          alt=""
          width="96"
          height="96"
          decoding="sync"
          fetchpriority="high"
        />
        <picture class="fishman-wrap">
          <source srcset="/splash-fishman.webp" type="image/webp" />
          <img
            class="fishman"
            src="/splash-fishman.png"
            alt=""
            width="75"
            height="75"
            decoding="sync"
            fetchpriority="high"
          />
        </picture>
      </div>
      <h1>Fishman</h1>
      <p id="app-splash-status">Starting up…</p>
      <div class="track" aria-hidden="true"><div class="bar"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
