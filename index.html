<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fishman</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0a;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #a3a3a3;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        opacity: 1;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #app-splash.app-splash-exit {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #app-splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(28, 119, 204, 0.14) 0%,
          transparent 44%
        );
        pointer-events: none;
      }

      #app-splash .mark {
        position: relative;
        width: 112px;
        height: 112px;
        z-index: 1;
      }

      #app-splash .sun {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        animation: splash-sun 5.5s linear infinite;
      }

      #app-splash .fishman {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 78%;
        height: 78%;
        object-fit: contain;
        filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.45));
        animation: splash-breathe 2.4s ease-in-out infinite;
      }

      #app-splash h1 {
        position: relative;
        z-index: 1;
        margin: 1.25rem 0 0.35rem;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #f5f5f5;
      }

      #app-splash p {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: 0.875rem;
        color: #737373;
      }

      #app-splash .track {
        position: relative;
        z-index: 1;
        margin-top: 1.5rem;
        width: 7rem;
        height: 2px;
        overflow: hidden;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.1);
      }

      #app-splash .bar {
        width: 50%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(
          90deg,
          rgba(204, 28, 57, 0.35),
          #e85a4f,
          rgba(204, 28, 57, 0.35)
        );
        animation: splash-bar 1.1s ease-in-out infinite;
      }

      @keyframes splash-sun {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes splash-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.03);
        }
      }

      @keyframes splash-bar {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(220%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash .sun,
        #app-splash .fishman,
        #app-splash .bar {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="app-splash" aria-hidden="true">
        <div class="mark" role="img" aria-label="Fishman">
          <img class="sun" src="/splash-sun.svg" alt="" width="112" height="112" />
          <img
            class="fishman"
            src="/splash-fishman.png"
            alt=""
            width="88"
            height="88"
          />
        </div>
        <h1>Fishman</h1>
        <p>Starting up…</p>
        <div class="track" aria-hidden="true"><div class="bar"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
